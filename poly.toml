[defaults]
line_length = 120
line_ending = "lf"
final_newline = true
trim_trailing_whitespace = true

[discovery]
exclude = [
  "**/*.lock",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  "coverage/**",
  "dist/**",
  "node_modules/**",
  "packages/dart/lib/src/_generated/**",
  "packages/go/v1/generated_api.go",
  "packages/go/v1/generated_pro.go",
  "packages/go/v1/oapi-codegen-pro.gen.yaml",
  "packages/python/src/xberg_io_sdk/_generated_api/**",
  "packages/python/src/xberg_io_sdk/_generated_pro/**",
  "packages/typescript/src/_generated/**",
  "spec/**",
  "spec/openapi.yaml/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
]

[per-file-ignores]
"**/tests/**/*.*" = [
  "A005",
  "ANN",
  "ARG001",
  "ARG002",
  "ASYNC230",
  "BLE001",
  "D",
  "N806",
  "N815",
  "PGH003",
  "PLC",
  "PLR0915",
  "PLR2004",
  "PT006",
  "PT007",
  "PT013",
  "PT017",
  "PT031",
  "RUF012",
  "S",
  "SIM117",
  "SLF001",
]
"e2e/**" = ["comment", "doc-comment"]
"**/e2e/**" = ["comment", "doc-comment"]
"test_apps/**" = ["comment", "doc-comment"]
"**/test_apps/**" = ["comment", "doc-comment"]
"docs/assets/**" = ["comment", "doc-comment"]
"**/generated/**" = ["comment", "doc-comment"]
"**/*.generated.*" = ["comment", "doc-comment"]
"**/*.g.*" = ["comment", "doc-comment"]
"**/*.freezed.*" = ["comment", "doc-comment"]
"crates/*-ffi/include/*.h" = ["comment", "doc-comment"]
"packages/go/include/*.h" = ["comment", "doc-comment"]
"Package.swift" = ["comment", "doc-comment"]

[lint.python.ruff]
pydocstyle_convention = "google"
mccabe_max_complexity = 15
pylint_max_args = 10
pylint_max_branches = 15
pylint_max_returns = 10
known_first_party = ["xberg_io_sdk"]
select = ["ALL"]
ignore = [
  "ANN401",
  "ASYNC109",
  "ASYNC110",
  "BLE001",
  "COM812",
  # ~keep Swept in by select = ["ALL"], which no other xberg-io repo uses — they select a
  # curated list instead, so CPY001 fires here and nowhere else. The org ships LICENSE
  # files rather than per-file copyright headers, so satisfying it would mean adding
  # headers to every .py file in this repo alone.
  "CPY001",
  "D100",
  "D104",
  "D107",
  "D205",
  "E501",
  "EM",
  "FBT",
  "FIX",
  "ISC001",
  "PD011",
  "PGH003",
  "PLR2004",
  "PLW0603",
  "S104",
  "S110",
  "S603",
  "TD",
  "TRY",
]

[lint.markdown.rumdl]
disable = ["MD013", "MD033", "MD041"]


[lint.uncomment]
enabled = true
remove_todos = false
remove_fixme = false
remove_docs = false
use_default_ignores = true
preserve_patterns = [
  "SAFETY",
  "HACK",
  "WORKAROUND",
  "NOTE",
  "Copyright",
  "Licensed",
  "License",
  "SPDX",
  "Apache",
  "MIT",
  "WITHOUT WARRANTIES",
  "limitations under the License",
  "copyright",
  "licensed",
  "license",
  "apache",
  "you may not use this file except in compliance",
  "You may obtain a copy of the License",
  "you may obtain a copy of the license",
  "http://www.apache.org/licenses/LICENSE-2.0",
  "http://www.apache.org/licenses/license-2.0",
  "Unless required by applicable law",
  "unless required by applicable law",
  "distributed under the License",
  "distributed under the license",
  "AS IS",
  "as is",
  "without warranties",
  "specific language governing permissions",
  "limitations under the license",
]
[fmt.markdown.rumdl]
disable = ["MD013", "MD033", "MD041"]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
lint = { exclude = [
  "**/*.lock",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  "coverage/**",
  "dist/**",
  "node_modules/**",
  "packages/dart/lib/src/_generated/**",
  "packages/go/v1/generated_api.go",
  "packages/go/v1/generated_pro.go",
  "packages/go/v1/oapi-codegen-pro.gen.yaml",
  "packages/python/src/xberg_io_sdk/_generated_api/**",
  "packages/python/src/xberg_io_sdk/_generated_pro/**",
  "packages/typescript/src/_generated/**",
  "spec/**",
  "spec/openapi.yaml/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
] }
fmt = { exclude = [
  "**/*.lock",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  "coverage/**",
  "dist/**",
  "node_modules/**",
  "packages/dart/lib/src/_generated/**",
  "packages/go/v1/generated_api.go",
  "packages/go/v1/generated_pro.go",
  "packages/go/v1/oapi-codegen-pro.gen.yaml",
  "packages/python/src/xberg_io_sdk/_generated_api/**",
  "packages/python/src/xberg_io_sdk/_generated_pro/**",
  "packages/typescript/src/_generated/**",
  "spec/**",
  "spec/openapi.yaml/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
] }
commit = { stages = ["commit-msg"] }
file_safety = { exclude = [
  "**/*.lock",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  "coverage/**",
  "dist/**",
  "node_modules/**",
  "packages/dart/lib/src/_generated/**",
  "packages/go/v1/generated_api.go",
  "packages/go/v1/generated_pro.go",
  "packages/go/v1/oapi-codegen-pro.gen.yaml",
  "packages/python/src/xberg_io_sdk/_generated_api/**",
  "packages/python/src/xberg_io_sdk/_generated_pro/**",
  "packages/typescript/src/_generated/**",
  "spec/**",
  "spec/openapi.yaml/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
] }

[tools.actionlint]
enabled = true

[tools.shfmt]
enabled = true

[tools.shellcheck]
enabled = true

[tools.pydocstyle]
enabled = true

[tools.golangci-lint]
enabled = true
