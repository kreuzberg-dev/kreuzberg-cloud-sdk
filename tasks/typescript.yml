version: "3"

# ~keep The TypeScript SDK ships ONE package (`@xberg-io/sdk`) with ONE dual-target
# client, generated from TWO OpenAPI specs kept as separate schema sets (never
# merged; see xberg-enterprise ADR-0072):
#   - spec/api/openapi.yaml -> src/_generated/api.d.ts  (Xberg Enterprise)
#   - spec/pro/openapi.yaml -> src/_generated/pro.d.ts  (Xberg Pro)
# The generated dir is gitignored; `generate` must run before `build`/`test`.
vars:
  PKG_DIR: packages/typescript

tasks:
  generate:
    desc: "Regenerate both TypeScript schema sets (Enterprise + Pro) via openapi-typescript"
    dir: "{{.PKG_DIR}}"
    cmds:
      - bash scripts/generate.sh

  install:
    desc: "Install TypeScript deps via pnpm"
    cmds:
      - pnpm install

  build:
    desc: "Regenerate schema types, then bundle TypeScript ESM + .d.ts via tsdown"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: generate
      - pnpm exec tsdown

  test:
    desc: "Run TypeScript test suite (vitest)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: generate
      - pnpm run test

  test:cov:
    desc: "Run TypeScript tests with coverage"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: generate
      - pnpm run test:coverage

  lint:
    desc: "Lint TypeScript (oxlint + tsc --noEmit)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: generate
      - pnpm run lint

  format:
    desc: "Format TypeScript (oxfmt)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - pnpm run format

  publish:
    desc: "Publish to npm with provenance"
    dir: "{{.PKG_DIR}}"
    cmds:
      - pnpm run build
      - pnpm publish --access public --provenance --no-git-checks
