version: "3"

# ~keep The Go SDK ships ONE package (`xberg`) with ONE dual-target client, generated
# from TWO OpenAPI specs kept as separate schema sets in the same package (never
# merged; see xberg-enterprise ADR-0072):
#   - spec/api/openapi.yaml -> packages/go/v1/generated_api.go  (Xberg Enterprise + shared)
#   - spec/pro/openapi.yaml -> packages/go/v1/generated_pro.go  (Xberg Pro-only)
# The Pro generation must skip every schema and operation the Enterprise spec
# already declares, or the same Go identifier is declared twice in the package.
# That exclusion set is DERIVED from the two specs by tools/oapi-pro-config on
# every run — never hand-maintained — so a spec sync cannot leave it stale.
vars:
  PKG_DIR: packages/go/v1
  TOOLS_DIR: tools/oapi-pro-config
  API_SPEC: spec/api/openapi.yaml
  PRO_SPEC: spec/pro/openapi.yaml
  PRO_CONFIG_BASE: oapi-codegen-pro.yaml
  PRO_CONFIG_DERIVED: oapi-codegen-pro.gen.yaml
  CONFIG_TOOL: github.com/xberg-io/sdks/tools/oapi-pro-config

tasks:
  generate:
    desc: "Regenerate both Go schema sets (Enterprise + Pro) via oapi-codegen"
    dir: "{{.PKG_DIR}}"
    cmds:
      - |
        set -euo pipefail
        ROOT="$(cd ../../.. && pwd)"
        go tool oapi-codegen --config oapi-codegen-api.yaml "$ROOT/{{.API_SPEC}}"
        go run {{.CONFIG_TOOL}} \
          -api "$ROOT/{{.API_SPEC}}" \
          -pro "$ROOT/{{.PRO_SPEC}}" \
          -base "{{.PRO_CONFIG_BASE}}" \
          -out "{{.PRO_CONFIG_DERIVED}}"
        go tool oapi-codegen --config "{{.PRO_CONFIG_DERIVED}}" "$ROOT/{{.PRO_SPEC}}"
      - go fmt ./...

  install:
    desc: "Download Go module dependencies"
    dir: "{{.PKG_DIR}}"
    cmds:
      - go mod download
      - go mod tidy

  build:
    desc: "Compile Go module (verifies build, no artifact)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - go build ./...

  test:tools:
    desc: "Run the codegen-tooling test suite (tools/oapi-pro-config)"
    dir: "{{.TOOLS_DIR}}"
    cmds:
      - go test -race ./...

  test:
    desc: "Run Go test suite"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: test:tools
      - go test -race -v ./...

  test:cov:
    desc: "Run Go tests with coverage"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: test:tools
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  lint:tools:
    desc: "Lint the codegen tooling (tools/oapi-pro-config)"
    dir: "{{.TOOLS_DIR}}"
    cmds:
      - go vet ./...

  lint:
    desc: "Lint Go sources (golangci-lint + govulncheck)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: lint:tools
      - golangci-lint run ./...
      - govulncheck ./...

  format:
    desc: "Format Go sources (gofmt)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - go fmt ./...
