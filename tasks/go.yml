version: "3"

# ~keep The Go SDK ships ONE package (`xberg`) with ONE dual-target client, generated
# from TWO OpenAPI specs kept as separate schema sets in the same package (never
# merged; see xberg-enterprise ADR-0072):
#   - spec/api/openapi.yaml -> packages/go/generated_api.go  (Xberg Enterprise + shared)
#   - spec/pro/openapi.yaml -> packages/go/generated_pro.go  (Xberg Pro-only)
# No Go identifier may be declared twice in one package, so tools/oapi-pro-config
# splits what both specs declare. An operation, or a schema whose two definitions
# generate IDENTICAL Go, is skipped by the Pro generation. A schema the specs
# declare with DIFFERENT structures cannot be skipped — that would hand Pro the
# Enterprise shape — so it is renamed behind a `Pro` prefix in a derived copy of
# the Pro spec (packages/go/spec-pro.gen.yaml), and oapi-codegen reads that
# copy. The vendored spec is left untouched so `task spec:check` still compares
# it byte-for-byte with upstream. Both the exclusion set and the renames are
# DERIVED from the two specs on every run — never hand-maintained — so a spec
# sync cannot leave them stale.
vars:
  PKG_DIR: packages/go
  TOOLS_DIR: tools/oapi-pro-config
  API_SPEC: spec/api/openapi.yaml
  PRO_SPEC: spec/pro/openapi.yaml
  PRO_CONFIG_BASE: oapi-codegen-pro.yaml
  PRO_CONFIG_DERIVED: oapi-codegen-pro.gen.yaml
  # Written by oapi-pro-config beside the derived config; see tools/oapi-pro-config.
  PRO_SPEC_DERIVED: spec-pro.gen.yaml
  CONFIG_TOOL: github.com/xberg-io/sdks/tools/oapi-pro-config

tasks:
  generate:
    desc: "Regenerate both Go schema sets (Enterprise + Pro) via oapi-codegen"
    dir: "{{.PKG_DIR}}"
    cmds:
      - |
        set -euo pipefail
        # ROOT_DIR is the repo root go-task resolved, so this survives PKG_DIR
        # moving depth. Counting `../` broke when packages/go/v1 became
        # packages/go and the spec was looked up a level above the repo.
        ROOT="{{.ROOT_DIR}}"
        go tool oapi-codegen --config oapi-codegen-api.yaml "$ROOT/{{.API_SPEC}}"
        go run {{.CONFIG_TOOL}} \
          -api "$ROOT/{{.API_SPEC}}" \
          -pro "$ROOT/{{.PRO_SPEC}}" \
          -base "{{.PRO_CONFIG_BASE}}" \
          -out "{{.PRO_CONFIG_DERIVED}}"
        # The derived spec, not the vendored one: oapi-pro-config renames any schema
        # the two specs declare with different shapes, so both can live in one package.
        go tool oapi-codegen --config "{{.PRO_CONFIG_DERIVED}}" "{{.PRO_SPEC_DERIVED}}"
      - go fmt ./...

  install:
    desc: "Download Go module dependencies"
    dir: "{{.PKG_DIR}}"
    cmds:
      - go mod download
      - go mod tidy

  build:
    desc: "Compile Go module (verifies build, no artifact)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - go build ./...

  test:tools:
    desc: "Run the codegen-tooling test suite (tools/oapi-pro-config)"
    dir: "{{.TOOLS_DIR}}"
    cmds:
      - go test -race ./...

  test:
    desc: "Run Go test suite"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: test:tools
      - go test -race -v ./...

  test:cov:
    desc: "Run Go tests with coverage"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: test:tools
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  lint:tools:
    desc: "Lint the codegen tooling (tools/oapi-pro-config)"
    dir: "{{.TOOLS_DIR}}"
    cmds:
      - go vet ./...

  lint:
    desc: "Lint Go sources (golangci-lint + govulncheck)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - task: lint:tools
      - golangci-lint run ./...
      - govulncheck ./...

  format:
    desc: "Format Go sources (gofmt)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - go fmt ./...
