version: "3"

vars:
  PKG_DIR: packages/dart
  GENERATED_DIR: packages/dart/lib/src/_generated

tasks:
  generate:
    desc: "Regenerate Dart client from spec/openapi.yaml via swagger_parser"
    cmds:
      - rm -rf {{.GENERATED_DIR}}
      - cd {{.PKG_DIR}} && dart run swagger_parser
      - |
        for f in {{.PKG_DIR}}/handrolled/models/*.dart; do
          cp "$f" "{{.GENERATED_DIR}}/models/$(basename "$f")"
        done
      - |
        python3 - <<'PY'
        from pathlib import Path

        generated_dir = Path("{{.GENERATED_DIR}}")
        handrolled = [
            "annotation_kind",
            "diff_line",
            "job_lookup_response",
            "node_content",
            "ocr_bounding_geometry",
            "primary_score",
            "reranker_spec",
            "revision_anchor",
            "vlm_fallback_policy",
        ]

        for model in handrolled:
            for path in (generated_dir / "models").glob(f"{model}_union*.dart"):
                path.unlink()

        export_file = generated_dir / "export.dart"
        lines = export_file.read_text().splitlines()
        output = []
        inserted = set()

        for line in lines:
            replaced = False
            for model in handrolled:
                if f"export 'models/{model}_union" in line:
                    if model not in inserted:
                        output.append(f"export 'models/{model}.dart';")
                        inserted.add(model)
                    replaced = True
                    break
            if not replaced:
                output.append(line)

        for model in handrolled:
            export = f"export 'models/{model}.dart';"
            if export not in output:
                root_index = output.index("// Root client")
                output.insert(root_index, export)

        export_file.write_text("\n".join(output) + "\n")

        tesseract_config = generated_dir / "models/tesseract_config.dart"
        text = tesseract_config.read_text()
        text = text.replace("@Default([eng])", "@Default(['eng'])")
        text = text.replace(
            "    @Default(ImagePreprocessingConfig.valueNull)\n"
            "    ImagePreprocessingConfig? preprocessing,",
            "    ImagePreprocessingConfig? preprocessing,",
        )
        tesseract_config.write_text(text)
        PY
      - cd {{.PKG_DIR}} && dart run build_runner build
      - cd {{.PKG_DIR}} && dart format lib/src/_generated
      - |
        python3 - <<'PY'
        from pathlib import Path

        for path in Path("{{.GENERATED_DIR}}").rglob("*.dart"):
            text = path.read_text()
            lines = [line.rstrip() for line in text.splitlines()]
            path.write_text("\n".join(lines) + "\n")
        PY

  install:
    desc: "Install Dart deps via dart pub"
    dir: "{{.PKG_DIR}}"
    cmds:
      - dart pub get

  build:
    desc: "Static-analyze the Dart package"
    dir: "{{.PKG_DIR}}"
    cmds:
      - dart analyze

  test:
    desc: "Run the Dart test suite"
    dir: "{{.PKG_DIR}}"
    cmds:
      - dart test

  lint:
    desc: "Static analysis (fatal on infos for CI parity)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - dart analyze --fatal-infos

  format:
    desc: "Format Dart sources"
    dir: "{{.PKG_DIR}}"
    cmds:
      - dart format lib test example

  publish:dry:
    desc: "Dry-run the pub.dev publish flow"
    dir: "{{.PKG_DIR}}"
    cmds:
      - dart pub publish --dry-run

  publish:
    desc: "Publish to pub.dev (assumes dart pub login has been completed)"
    dir: "{{.PKG_DIR}}"
    cmds:
      - dart pub publish --force
