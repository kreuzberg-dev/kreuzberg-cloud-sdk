version: "3"

vars:
  SPEC_PATH: spec/openapi.yaml
  UPSTREAM_LOCAL: ../xberg-enterprise/services/api/spec/openapi.json
  UPSTREAM_URL: '{{.XBERG_ENTERPRISE_URL | default "https://api.xberg.io"}}/api-doc/openapi.json'

tasks:
  fetch:
    desc: "Refresh spec/openapi.yaml from sibling xberg-enterprise repo (JSON → YAML)"
    cmds:
      - yq -P -oy '.' {{.UPSTREAM_LOCAL}} > {{.SPEC_PATH}}
      - git diff --stat {{.SPEC_PATH}} || true

  fetch:remote:
    desc: "Refresh spec/openapi.yaml from a running xberg-enterprise API server"
    cmds:
      - curl -fsSL {{.UPSTREAM_URL}} | yq -P -oy '.' > {{.SPEC_PATH}}
      - git diff --stat {{.SPEC_PATH}} || true

  check:
    desc: "Fail if vendored spec drifted from sibling xberg-enterprise copy"
    cmds:
      - diff -q <(yq -P -oy '.' {{.UPSTREAM_LOCAL}}) {{.SPEC_PATH}}

  show:
    desc: "Print the current vendored spec path"
    cmds:
      - echo "{{.SPEC_PATH}}"
