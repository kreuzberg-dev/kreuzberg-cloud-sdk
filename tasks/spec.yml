version: "3"

# The SDK vendors TWO OpenAPI specs — the Enterprise managed API (`services/api`)
# and Pro (`services/pro`) — and generates one dual-target client from both.
# Merging is deliberately avoided (operationId collisions + topology honesty);
# see xberg-enterprise ADR-0072.
vars:
  API_SPEC: spec/api/openapi.yaml
  PRO_SPEC: spec/pro/openapi.yaml
  UPSTREAM_API_LOCAL: ../xberg-enterprise/services/api/spec/openapi.json
  UPSTREAM_PRO_LOCAL: ../xberg-enterprise/services/pro/spec/openapi.json
  UPSTREAM_API_URL: '{{.XBERG_ENTERPRISE_URL | default "https://api.xberg.io"}}/api-doc/openapi.json'

tasks:
  fetch:
    desc: "Refresh both vendored specs from the sibling xberg-enterprise repo (JSON → YAML)"
    cmds:
      - yq -P -oy '.' {{.UPSTREAM_API_LOCAL}} > {{.API_SPEC}}
      - yq -P -oy '.' {{.UPSTREAM_PRO_LOCAL}} > {{.PRO_SPEC}}
      - git diff --stat {{.API_SPEC}} {{.PRO_SPEC}} || true

  fetch:remote:
    desc: "Refresh the Enterprise spec from a running xberg-enterprise API server"
    cmds:
      - curl -fsSL {{.UPSTREAM_API_URL}} | yq -P -oy '.' > {{.API_SPEC}}
      - git diff --stat {{.API_SPEC}} || true

  check:
    desc: "Fail if either vendored spec drifted from the sibling xberg-enterprise copy"
    cmds:
      - diff -q <(yq -P -oy '.' {{.UPSTREAM_API_LOCAL}}) {{.API_SPEC}}
      - diff -q <(yq -P -oy '.' {{.UPSTREAM_PRO_LOCAL}}) {{.PRO_SPEC}}

  show:
    desc: "Print the vendored spec paths"
    cmds:
      - echo "api={{.API_SPEC}} pro={{.PRO_SPEC}}"
