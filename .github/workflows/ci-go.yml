name: ci-go

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/go/**"
      - "spec/api/**"
      - "spec/pro/**"
      - "tasks/go.yml"
      - "go.work"
      - ".github/workflows/ci-go.yml"
  push:
    branches: [main]
    paths:
      - "packages/go/**"
      - "spec/api/**"
      - "spec/pro/**"
      - "tasks/go.yml"
      - "go.work"

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (go 1.26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Install task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # ~keep golangci-lint-action@v8 always runs `golangci-lint run`, not just installs the
      # binary — that would lint packages/go/v1 before "Generate client" writes the gitignored
      # generated_api.go/generated_pro.go, failing typecheck. Install the binary only here;
      # `task go:lint` (after generation) is the sole place golangci-lint actually runs.
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" latest
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Generate client
        run: task go:generate
      - name: Lint
        run: task go:lint
      - name: Test (with coverage)
        run: task go:test:cov
