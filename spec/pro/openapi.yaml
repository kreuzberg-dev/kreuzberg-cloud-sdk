    get:
      tags:
        - integrations
      summary: GET /v1/oauth/callback — OAuth callback (PUBLIC, no auth required).
      description: |-
        This endpoint receives the authorization code and state token from the OAuth provider.
        On success, redirects to the frontend landing URL.
        On failure, returns a generic error (no oracle to leak valid projects).
      operationId: oauth_callback
      parameters:
        - name: code
          in: query
          description: Authorization code from the provider
          required: false
          schema:
            type: string
        - name: state
          in: query
          description: Signed state token issued by the connect call
          required: false
          schema:
            type: string
        - name: error
          in: query
          description: Provider error code when the user denied access
          required: false
          schema:
            type: string
      responses:
        "303":
          description: Redirect to the dashboard landing URL, on success and on a provider-reported denial
        "400":
          description: Missing code or state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          description: Request fails validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: Callback rate limit exceeded for this client address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: The code exchange failed; the response carries no detail about the flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Integration hub is not configured
