        ids:
          type:
            - array
            - "null"
          items:
            type: string
            format: uuid
          description: List of document UUIDs to delete.
    DeleteDocumentsResponse:
      type: object
      description: Response for deletion operation
      required:
        - deleted_count
      properties:
        deleted_count:
          type: integer
          format: int64
          description: Number of documents deleted
          minimum: 0
    DiffAsyncAccepted:
