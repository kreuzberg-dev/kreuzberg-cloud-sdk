        config:
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/FileExtractionConfig'
              description: |-
                Per-file extraction config override.
                Merged with batch-level `config` at confirm time. None = use batch default.
        filename:
          type: string
          description: Original filename
        mime_type:
          type: string
          description: MIME type of the document
    PresignUploadRequest:
      type: object
      description: Request body for presigning upload URLs
      required:
        - documents
      properties:
        config:
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/ExtractionConfig'
              description: Batch-level extraction configuration (applied to all documents)
        documents:
          type: array
          items:
            $ref: '#/components/schemas/PresignDocumentInput'
          description: Document metadata (no file data)
        webhook:
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/WebhookConfig'
              description: Webhook configuration for async result delivery
    PresignUploadResponse:
      type: object
      description: Response from presign endpoint
      required:
        - batch_id
        - uploads
      properties:
        batch_id:
          type: string
          description: Batch ID — pass this to the confirm endpoint
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/PresignedUploadInfo'
          description: Per-document upload URLs
    PresignedUploadInfo:
      type: object
      description: Info about a single presigned upload
      required:
        - job_id
        - upload_url
        - object_key
        - method
        - expires_in_secs
      properties:
        expires_in_secs:
          type: integer
          format: int64
          description: Seconds until the URL expires
          minimum: 0
        job_id:
          type: string
          description: Job ID for this document
        method:
          type: string
          description: HTTP method to use (PUT)
        object_key:
          type: string
          description: Storage object key
        upload_url:
          type: string
          description: Presigned URL to upload the document to
    PrimaryScore:
      oneOf:
        - type: object
          description: Vector similarity score.
          required:
            - score
            - kind
          properties:
            kind:
              type: string
              enum:
                - vector
            score:
              type: number
              format: float
              description: Score value.
        - type: object
          description: Full-text rank score.
          required:
            - score
            - kind
          properties:
            kind:
              type: string
              enum:
                - full_text
            score:
              type: number
              format: float
              description: Score value.
        - type: object
          description: RRF-fused vector + full-text.
          required:
            - vector
            - full_text
            - rrf
            - kind
          properties:
            full_text:
              type: number
              format: float
              description: Full-text component.
            kind:
              type: string
              enum:
                - hybrid
            rrf:
              type: number
              format: float
              description: Reciprocal-rank-fusion combined score.
            vector:
              type: number
              format: float
              description: Vector component.
      description: JSON-friendly mirror of vectorstore's internal `PrimaryScore`.
    ProcessingWarning:
      type: object
      description: |-
        A non-fatal warning from a processing pipeline stage.

        Captures errors from optional features that don't prevent extraction
        but may indicate degraded results.
      required:
        - source
        - message
      properties:
        message:
          type: string
          description: Human-readable description of what went wrong.
        source:
          type: string
          description: |-
            The pipeline stage or feature that produced this warning
            (e.g., "embedding", "chunking", "language_detection", "output_format").
    PromoteProfileRequest:
      type: object
      description: |-
        Request to promote a completed auto-tune result to a named, reusable
        tuning profile.
      required:
        - name
      properties:
        name:
          type: string
          description: Name to give the promoted tuning profile.
    PropertyChange:
      type: object
      description: |-
        A single run-level or style-level property change.

        Used for revisions that change formatting rather than text content. `from`
        and `to` store normalized property values when the source format exposes
        them; either side may be absent when the format only records one side of the
        change.
      required:
        - name
      properties:
        from:
          type:
            - string
            - "null"
          description: Value before the change, when available.
        name:
          type: string
          description: Property name, such as `"bold"`, `"italic"`, `"font_size"`, or `"font_color"`.
        to:
          type:
            - string
            - "null"
          description: Value after the change, when available.
    ProxyOverride:
      type: object
      description: |-
        Per-request proxy override. When set on a crawl request, this proxy is
        used instead of the worker's process-wide `CRAWL_PROXY_URLS` pool.
        Maps 1:1 onto `crawlberg::ProxyConfig`.
      required:
        - url
      properties:
        password:
          type:
            - string
            - "null"
          description: Optional password for proxy auth.
        url:
          type: string
          description: Full proxy URL — `http://`, `https://`, `socks5://` or `socks5h://`.
          example: http://proxy.example.com:8080
        username:
          type:
            - string
            - "null"
          description: Optional username for proxy auth.
    PstMetadata:
      type: object
      description: Outlook PST archive metadata.
      required:
        - message_count
      properties:
        message_count:
          type: integer
          description: Total number of email messages found in the PST archive.
          minimum: 0
    QrBoundingBox:
      type: object
      description: Pixel-space bounding box of a QR code inside its source image.
      required:
        - x
        - y
        - width
        - height
      properties:
        height:
          type: integer
          format: int32
          description: Height of the bounding box in pixels.
          minimum: 0
        width:
          type: integer
          format: int32
          description: Width of the bounding box in pixels.
          minimum: 0
        x:
          type: integer
          format: int32
          description: Horizontal pixel offset of the bounding box top-left corner.
          minimum: 0
        y:
          type: integer
          format: int32
          description: Vertical pixel offset of the bounding box top-left corner.
          minimum: 0
    QrCode:
      type: object
      description: One QR code decoded from an extracted image.
      required:
        - payload
      properties:
        bbox:
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/QrBoundingBox'
              description: |-
                Bounding box of the QR code inside the source image, in pixel coordinates
                (`x`, `y` of the top-left corner; `width`, `height` of the rectangle).
                `None` if the decoder did not report a bounding box.
        confidence:
          type:
            - number
            - "null"
          format: float
          description: |-
            Detector-reported confidence in `[0.0, 1.0]`. `None` when the decoder
            does not expose confidence (the default `rqrr` backend always reports
            `Some` because successful decode implies high confidence).
        payload:
          type: string
          description: Decoded payload (text, URL, vCard string, …).
    RagJobKind:
      type: string
      description: Operation type for RAG async jobs
      enum:
        - ingest
        - reindex
        - migrate
    RagJobProgress:
      type: object
      description: Progress details for long-running operations (migrate only)
      required:
        - documents_total
        - documents_processed
        - current_phase
      properties:
        current_phase:
          type: string
          description: 'Current processing phase (for migrate: "dual_write"|"index_build"|"swap"|"cleanup")'
        documents_processed:
          type: integer
          format: int64
          description: Documents successfully processed
          minimum: 0
        documents_total:
          type: integer
          format: int64
          description: Total documents to process
          minimum: 0
    RagJobState:
      type: string
      description: Job lifecycle state
      enum:
        - pending
        - running
        - completed
        - failed
    RagJobStatusResponse:
      type: object
      description: |-
        Unified RAG async job status response covering ingest, reindex, and migrate operations.

        The response shape varies depending on the operation type (`kind`):
        - **ingest**: status field reflects document ingestion progress (pending, indexed, failed)
        - **reindex**: status field reflects re-chunking and re-embedding progress
        - **migrate**: status and progress fields reflect embedding migration state
      required:
        - job_id
        - kind
        - state
        - created_at
      properties:
        collection_id:
          type:
            - string
            - "null"
          format: uuid
          description: Associated collection ID (for migrate only; absent for ingest/reindex)
        created_at:
          type: string
          description: Timestamp when job was submitted (RFC3339)
        document_id:
          type:
            - string
            - "null"
          format: uuid
          description: Associated document ID (for ingest/reindex only; absent for migrate)
        error:
          type:
            - string
            - "null"
          description: Error message if state = failed
        job_id:
          type: string
          description: Job identifier (ULID) for this async operation
        kind:
          $ref: '#/components/schemas/RagJobKind'
          description: 'Operation type: "ingest", "reindex", or "migrate"'
        progress:
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/RagJobProgress'
              description: Progress details (only for migrate operations; null for ingest/reindex)
        state:
          $ref: '#/components/schemas/RagJobState'
          description: Current job state
    RakeParams:
      type: object
      description: RAKE-specific parameters.
      required:
        - min_word_length
        - max_words_per_phrase
      properties:
        max_words_per_phrase:
          type: integer
          description: 'Maximum words in a keyword phrase (default: 3).'
          minimum: 0
        min_word_length:
          type: integer
          description: 'Minimum word length to consider (default: 1).'
          minimum: 0
    ReadinessChecks:
      type: object
      description: Individual dependency check results
      required:
        - database
        - nats
      properties:
        database:
          type: string
          description: Database connectivity
          example: ok
        nats:
          type: string
          description: NATS connectivity
          example: ok
    ReadinessResponse:
      type: object
      description: Readiness check response with dependency status
      required:
        - status
        - checks
      properties:
        checks:
          $ref: '#/components/schemas/ReadinessChecks'
          description: Dependency check results
        status:
          type: string
          description: Overall readiness status
          example: ready
    RedactionFinding:
      type: object
      description: 'One redaction event: which span was rewritten, why, and with what.'
      required:
        - start
        - end
        - category
        - strategy
        - replacement_token
      properties:
        category:
          $ref: '#/components/schemas/PiiCategory'
          description: PII category that fired this redaction.
        end:
          type: integer
          format: int32
          description: Byte-offset end (exclusive) in the original `ExtractedDocument::content`.
          minimum: 0
        replacement_token:
          type: string
          description: |-
            String that replaced the original mention. Always present; for `Drop` the
            replacement is the empty string.
        start:
          type: integer
          format: int32
          description: Byte-offset start in the original (pre-redaction) `ExtractedDocument::content`.
          minimum: 0
        strategy:
          $ref: '#/components/schemas/RedactionStrategy'
          description: Strategy applied to this finding (mask, hash, token-replace, drop).
    RedactionReport:
      type: object
      description: |-
        Audit report describing what the redaction processor found and how it replaced it.

        The redactor returns this alongside the rewritten content so compliance, replay, and
        audit-log consumers can see exactly what fired. Offsets are relative to the *original*
        pre-redaction `content` and are intended for audit reconstruction only — the original
        bytes are dropped at the end of the pipeline.
      required:
        - findings
        - total_redacted
      properties:
        findings:
          type: array
          items:
            $ref: '#/components/schemas/RedactionFinding'
          description: Individual redaction findings in original-source byte order.
        total_redacted:
          type: integer
          format: int32
          description: Total number of redactions applied across the document.
          minimum: 0
    RedactionStrategy:
      type: string
      description: Strategy applied when a PII match is rewritten.
      enum:
        - mask
        - hash
        - token_replace
        - drop
    ReindexRequest:
      type: object
      description: Request to reindex a document (re-chunk, re-enrich, re-embed)
      properties:
        re_extract:
          type: boolean
          description: If true, re-extract from source object via xberg before re-chunking
        webhook:
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/WebhookConfig'
              description: Optional webhook for reindex completion/failure delivery.
      additionalProperties: false
    RelationshipKind:
      type: string
      description: Semantic kind of a relationship between document elements.
      enum:
        - footnote_reference
        - citation_reference
        - internal_link
        - caption
        - label
        - toc_entry
        - cross_reference
    RerankerKind:
      type: string
      description: |-
        Wire-shape mirror of the internal `RerankerKind` — the response shape stays
        stable even when we add variants internally.
      enum:
        - preset
        - llm
    RerankerSpec:
      oneOf:
        - type: object
          description: Local ONNX cross-encoder preset.
          required:
            - name
            - type
          properties:
            name:
              type: string
              description: 'Preset name: `fast | balanced | quality | multilingual`.'
            type:
              type: string
              enum:
                - preset
        - type: object
          description: Platform-managed LLM reranker (provider + API key from Helm env).
          required:
            - type
          properties:
            model:
              type:
                - string
                - "null"
              description: |-
                Optional model override (e.g. `"gemini-1.5-pro"`). When
                `None`, the platform default is used.
            type:
              type: string
              enum:
                - llm
      description: |-
        Caller-specified reranker. The Llm variant carries an optional
        model override that picks from the platform-supported set.
    RetrieveMode:
      type: string
      description: Retrieve mode discriminant.
      enum:
        - vector
        - full_text
        - hybrid
    RetrieveRequest:
      type: object
      description: Retrieve request body.
      properties:
        candidate_multiplier:
          type:
            - integer
            - "null"
          format: int32
          description: |-
            1..=20, default 4. Ignored when rerank is inactive. The store
            pulls `top_k * candidate_multiplier` candidates from the
            primary stage so the reranker has more to choose from.
          minimum: 0
        filter:
          description: Filter expression (deserialized by the vectorstore Filter IR).
        group_by_document:
          type: boolean
          description: Collapse to one chunk per document.
        include:
          $ref: '#/components/schemas/IncludeMask'
          description: Optional response field mask.
        mode:
          $ref: '#/components/schemas/RetrieveMode'
          description: Retrieve mode. Defaults to `hybrid`.
        query:
          type:
            - string
            - "null"
          description: |-
            Text query. Required for full_text and hybrid modes; optional
            for vector mode when `query_vector` is supplied.
        query_vector:
          type:
            - array
            - "null"
          items:
            type: number
            format: float
          description: |-
            BYO query vector. Length must equal the collection's
            `embedding_dim`. Forbidden when `mode = full_text`.
        rerank:
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/RerankerSpec'
              description: |-
                Three-state rerank: absent (collection default) | null
                (disable) | present (override). The OpenAPI schema documents
                this as `Option<RerankerSpec>` — callers control the third
                state by simply omitting the field.
        top_k:
          type: integer
          format: int32
          description: Number of top results to return. `1..=200`, default 10.
          minimum: 0
      additionalProperties: false
    RetrieveResponse:
      type: object
      description: Retrieve response body.
      required:
        - mode
        - latency_breakdown
        - chunks
      properties:
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/RetrievedChunk'
          description: Result chunks (relevance-ordered).
        latency_breakdown:
          $ref: '#/components/schemas/LatencyBreakdown'
          description: Latency breakdown.
        mode:
          $ref: '#/components/schemas/RetrieveMode'
          description: Mode used.
        rerank_applied:
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/RerankerKind'
              description: |-
                Which reranker (if any) was actually applied. `None` if rerank
                was off; also `None` if rerank was active but fell back to the
                primary order — in that case `chunks[i].score_breakdown.rerank_fallback`
                records the reason.
    RetrievedChunk:
      type: object
      description: Single retrieved chunk in the response.
      required:
        - id
        - document_id
        - ordinal
        - score
        - chunk_metadata
      properties:
        chunk_metadata:
          description: Chunk-level metadata.
        content:
          type:
            - string
            - "null"
          description: Chunk content. Present iff `include.content`.
        document:
          description: Parent document summary. Present iff `include.document`.
        document_id:
          type: string
          format: uuid
          description: Parent document ID.
        external_id:
          type:
            - string
            - "null"
          description: Caller-supplied external_id, if any.
        id:
          type: string
          format: uuid
          description: Chunk ID.
        ordinal:
          type: integer
          format: int32
          description: Position within document.
          minimum: 0
        score:
          type: number
          format: float
          description: Effective score after rerank (or primary score when rerank off).
        score_breakdown:
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/ScoreBreakdown'
              description: Score detail. Present iff `include.score_breakdown`.
    RevisionAnchor:
      oneOf:
        - type: object
          description: Body paragraph, identified by its zero-based index in the document flow.
          required:
            - index
            - type
          properties:
            index:
              type: integer
              description: Zero-based index of the paragraph in document order.
              minimum: 0
            type:
              type: string
              enum:
                - paragraph
        - type: object
          description: Cell inside a table.
          required:
            - row
            - col
            - table_index
            - type
          properties:
            col:
              type: integer
              description: Zero-based column index within the table.
              minimum: 0
            row:
              type: integer
              description: Zero-based row index within the table.
              minimum: 0
            table_index:
              type: integer
              description: Zero-based index of the table in document order.
              minimum: 0
            type:
              type: string
              enum:
                - table_cell
        - type: object
          description: Page, identified by its zero-based index.
          required:
            - index
            - type
          properties:
            index:
              type: integer
              description: Zero-based page index.
              minimum: 0
            type:
              type: string
              enum:
                - page
        - type: object
          description: Presentation slide, identified by its zero-based index.
          required:
            - index
            - type
          properties:
            index:
              type: integer
              description: Zero-based slide index.
              minimum: 0
            type:
              type: string
              enum:
                - slide
        - type: object
          description: Spreadsheet cell or range, identified by sheet index and optional name.
          required:
            - index
            - type
          properties:
            index:
              type: integer
              description: Zero-based sheet index.
              minimum: 0
            name:
              type:
                - string
                - "null"
              description: Sheet display name when available.
            type:
              type: string
              enum:
                - sheet
      description: Best-effort document location for a revision.
    RevisionDelta:
      type: object
      description: |-
        The content changes that make up a single revision.

        For insertions and deletions the `content` field carries the added/removed
        lines as `DiffLine::Added` / `DiffLine::Removed` entries. For format
        changes, `property_changes` carries normalized before/after formatting
        values when the source document exposes them.
      required:
        - content
        - table_changes
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/DiffLine'
          description: Line-level content changes for this revision.
        property_changes:
          type: array
          items:
            $ref: '#/components/schemas/PropertyChange'
          description: Formatting or metadata property changes for this revision.
        table_changes:
          type: array
          items:
            $ref: '#/components/schemas/CellChange'
          description: Cell-level table changes for this revision.
    RevisionKind:
      type: string
      description: Semantic classification of a tracked change.
      enum:
        - insertion
        - deletion
        - format_change
        - comment
    SchemaCompliance:
      type: string
      description: |-
        Schema-validation outcome surfaced as one of three buckets.

        Fold into the combined confidence score without leaking internal validation
        error types.
      enum:
        - all_valid
        - partial_valid
        - all_invalid
    ScoreBreakdown:
      type: object
      description: Score detail for a single returned chunk.
      required:
        - primary
        - rank_primary
        - rank_final
      properties:
        primary:
          $ref: '#/components/schemas/PrimaryScore'
          description: Primary-stage score discriminant + value(s).
        rank_final:
          type: integer
          format: int32
          description: |-
            Rank position after reranking (1-indexed). Equal to
            `rank_primary` when rerank was off or fell back.
          minimum: 0
        rank_primary:
          type: integer
          format: int32
          description: Rank position in the primary-stage result set (1-indexed).
          minimum: 0
        rerank:
          type:
            - number
            - "null"
          format: float
          description: Reranker score when rerank was applied. `None` otherwise.
        rerank_fallback:
          type:
            - string
            - "null"
          description: |-
            Reason rerank was skipped or fell back, if applicable.
            Values: `"timeout"`.
    SecurityLimits:
      type: object
      description: |-
        Configuration for security limits across extractors.

        All limits are intentionally conservative to prevent DoS attacks
        while still supporting legitimate documents.
      properties:
        max_archive_size:
          type: integer
          description: Maximum uncompressed size for archives (500 MB)
          default: 524288000
          minimum: 0
        max_compression_ratio:
          type: integer
          description: Maximum compression ratio before flagging as potential bomb (100:1)
          default: 100
          minimum: 0
        max_content_size:
          type: integer
          description: Maximum string growth per document (100 MB)
          default: 104857600
          minimum: 0
        max_entity_length:
          type: integer
          description: |-
            Maximum length of any single XML entity / attribute / token (1 MiB).
            This is a per-token cap, NOT a total cap — billion-laughs class
            attacks where a single entity expands to hundreds of MB are caught
            here, while normal long text content (a paragraph, a CDATA block) is
            caught by `max_content_size` instead.
          default: 1048576
          minimum: 0
        max_files_in_archive:
          type: integer
          description: Maximum number of files in archive (10,000)
          default: 10000
          minimum: 0
        max_iterations:
          type: integer
          description: Maximum iterations per operation
          default: 10000000
          minimum: 0
        max_nesting_depth:
          type: integer
          description: Maximum nesting depth for structures (100)
          default: 1024
          minimum: 0
        max_table_cells:
          type: integer
          description: Maximum cells per table (100,000)
          default: 100000
          minimum: 0
        max_xml_depth:
          type: integer
          description: Maximum XML depth (100 levels)
          default: 1024
          minimum: 0
    StructuredData:
      type: object
      description: Structured data (Schema.org, microdata, RDFa) block.
      required:
        - data_type
        - raw_json
      properties:
        data_type:
          $ref: '#/components/schemas/StructuredDataType'
          description: Type of structured data
        raw_json:
          type: string
          description: Raw JSON string representation
        schema_type:
          type:
            - string
            - "null"
          description: Schema type if detectable (e.g., "Article", "Event", "Product")
    StructuredDataType:
      type: string
      description: Structured data type classification.
      enum:
        - json-ld
        - microdata
        - rdfa
    StructuredExtractionConfig:
      type: object
      description: |-
        LLM-driven structured extraction.

        When set, the worker passes the extracted document text and the supplied
        JSON schema to an LLM provider (routed through liter-llm) and returns the
        validated JSON on `ExtractionResult::structured_output`.
      required:
        - schema
        - llm
      properties:
        llm:
          $ref: '#/components/schemas/LlmConfig'
          description: LLM provider + model configuration.
        prompt:
          type:
            - string
            - "null"
          description: Custom Jinja2 prompt template. When omitted, the xberg default is used.
        schema:
          description: JSON Schema (draft-07) the structured output must conform to.
        schema_description:
          type:
            - string
            - "null"
          description: Optional human-readable schema description supplied to the LLM.
        schema_name:
          type: string
          description: Schema name passed to the LLM's structured-output mode. Defaults to "extraction".
        strict:
          type: boolean
          description: Strict mode — output must match the schema exactly (provider-dependent).
    SummaryStrategy:
      type: string
      description: Summarisation strategy.
      enum:
        - extractive
        - abstractive
    Table:
      type: object
      description: |-
        Extracted table structure.

        Represents a table detected and extracted from a document (PDF, image, etc.).
        Tables are converted to both structured cell data and Markdown format.
      required:
        - cells
        - markdown
        - page_number
      properties:
        bounding_box:
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/BoundingBox'
              description: |-
                Bounding box of the table on the page (PDF coordinates: x0=left, y0=bottom, x1=right, y1=top).
                Only populated for PDF-extracted tables when position data is available.
        cells:
          type: array
          items:
            type: array
            items:
              type: string
          description: Table cells as a 2D vector (rows × columns)
        columns:
          type:
            - array
            - "null"
          items:
            type: string
          description: |-
            Header cells for this fragment, i.e. the first row of `cells`.

            Populated even when this fragment's own header row was merged away or
            physically lives in a sibling fragment (see `table_id`), so a single
            fragment is interpretable in isolation. `None` when no header row
            could be determined.
        markdown:
          type: string
          description: Markdown representation of the table
        page_number:
          type: integer
          format: int32
          description: Page number where the table was found (1-indexed)
          minimum: 0
        table_id:
          type:
            - string
            - "null"
          description: |-
            Stable identifier shared by every `tables[]` entry that represents a
            fragment of the same physical table.

            Assigned deterministically by the extraction pipeline (e.g. a
            sequential `"table-N"` in document order); never derived from
            randomness or wall-clock time, so the same input document always
            produces the same ids. Consumers can use it to reconcile the markdown
            blocks in `content` / `pages[].content` / `chunks[].content` with the
            structured entries in `tables[]`. `None` when the extractor did not
            assign one.

            Today, same-page fragments of one physical table are already merged
            into a single `tables[]` entry before ids are assigned (see PDF table
            stitching), so in practice `table_id` is unique per entry rather than
            shared across several. A table split across a page boundary is
            intentionally *not* linked — its per-page pieces get separate ids.
            Sharing one id across page-boundary fragments is a known possible
            future extension, not implemented yet.
    TableGrid:
      type: object
      description: |-
        Structured table grid with cell-level metadata.

        Stores row/column dimensions and a flat list of cells with position info.
      required:
        - rows
        - cols
        - cells
      properties:
        cells:
          type: array
          items:
            $ref: '#/components/schemas/GridCell'
          description: All cells in row-major order.
        cols:
          type: integer
          format: int32
          description: Number of columns in the table.
          minimum: 0
        rows:
          type: integer
          format: int32
          description: Number of rows in the table.
          minimum: 0
    TesseractConfig:
      type: object
      description: |-
        Tesseract OCR configuration.

        Provides fine-grained control over Tesseract OCR engine parameters.
        Most users can use the defaults, but these settings allow optimization
        for specific document types (invoices, handwriting, etc.).
      properties:
        classify_use_pre_adapted_templates:
          type: boolean
          description: Use pre-adapted templates for character classification
          default: true
        enable_table_detection:
          type: boolean
          description: Enable automatic table detection and reconstruction
          default: true
        language:
          type: array
          items:
            type: string
          description: |-
            Language code(s) for OCR recognition.
            Accepts either a single language code ("eng") or a list (["eng", "deu"]).
            For Tesseract backend, languages are joined with "+".
          default:
            - eng
        language_model_ngram_on:
          type: boolean
          description: Enable N-gram language model
          default: false
        min_confidence:
          type: number
          format: double
          description: |-
            Minimum confidence threshold (0.0-100.0).

            Words with confidence below this threshold may be rejected or flagged.
          default: 0
        oem:
          type: integer
          format: int32
          description: |-
            OCR Engine Mode (0-3).

            - 0: Legacy engine only
            - 1: Neural nets (LSTM) only (usually best)
            - 2: Legacy + LSTM
            - 3: Default (based on what's available)
          default: 3
        output_format:
          type: string
          description: Output format ("text" or "markdown")
          default: markdown
        preprocessing:
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/ImagePreprocessingConfig'
              description: |-
                Image preprocessing configuration.

                Controls how images are preprocessed before OCR. Can significantly
                improve quality for scanned documents or low-quality images.
          default: null
        psm:
          type: integer
          format: int32
          description: |-
            Page Segmentation Mode (0-13).

            Common values:
            - 3: Fully automatic page segmentation (native default)
            - 6: Assume a single uniform block of text (WASM default — avoids layout-analysis hang)
            - 11: Sparse text with no particular order
          default: 3
        table_column_threshold:
          type: integer
          format: int32
          description: Column threshold for table detection (pixels)
          default: 50
        table_min_confidence:
          type: number
          format: double
          description: Minimum confidence threshold for table detection (0.0-1.0)
          default: 0
        table_row_threshold_ratio:
          type: number
          format: double
          description: Row threshold ratio for table detection (0.0-1.0)
          default: 0.5
        tessedit_char_blacklist:
          type: string
          description: Blacklist of forbidden characters (empty = none forbidden)
          default: ""
        tessedit_char_whitelist:
          type: string
          description: Whitelist of allowed characters (empty = all allowed)
          default: ""
        tessedit_dont_blkrej_good_wds:
          type: boolean
          description: Don't reject good words during block-level processing
          default: true
        tessedit_dont_rowrej_good_wds:
          type: boolean
          description: Don't reject good words during row-level processing
          default: true
        tessedit_enable_dict_correction:
          type: boolean
          description: Enable dictionary correction
          default: true
        tessedit_use_primary_params_model:
          type: boolean
          description: Use primary language params model
          default: true
        textord_space_size_is_variable:
          type: boolean
          description: Variable-width space detection
          default: true
        thresholding_method:
          type: boolean
          description: Use adaptive thresholding method
          default: false
        use_cache:
          type: boolean
          description: Enable OCR result caching
          default: true
    TextAnnotation:
      type: object
      description: |-
        Inline text annotation — byte-range based formatting and links.

        Annotations reference byte offsets into the node's text content,
        enabling precise identification of formatted regions.
      required:
        - start
        - end
        - kind
      properties:
        end:
          type: integer
          format: int32
          description: End byte offset in the node's text content (exclusive).
          minimum: 0
        kind:
          $ref: '#/components/schemas/AnnotationKind'
          description: Annotation type.
        start:
          type: integer
          format: int32
          description: Start byte offset in the node's text content (inclusive).
          minimum: 0
    TextDirection:
      type: string
      description: Text direction enumeration for HTML documents.
      enum:
        - ltr
        - rtl
        - auto
    TextMetadata:
      type: object
      description: |-
        Text/Markdown metadata.

        Extracted from plain text and Markdown files. Includes word counts and,
        for Markdown, structural elements like headers and links.
      required:
        - line_count
        - word_count
        - character_count
      properties:
        character_count:
          type: integer
          format: int32
          description: Number of characters
          minimum: 0
        code_blocks:
          type:
            - array
            - "null"
          items:
            type: array
            items:
              type: string
          description: Code blocks as (language, code) tuples (for Markdown files)
        headers:
          type:
            - array
            - "null"
          items:
            type: string
          description: Markdown headers (headings text only, for Markdown files)
        line_count:
          type: integer
          format: int32
          description: Number of lines in the document
          minimum: 0
        links:
          type:
            - array
            - "null"
          items:
            type: array
            items:
              type: string
          description: Markdown links as (text, url) tuples (for Markdown files)
        word_count:
          type: integer
          format: int32
          description: Number of words
          minimum: 0
    TokenReductionConfig:
      type: object
      description: Token reduction configuration for LLM consumption.
      properties:
        mode:
          type:
            - string
            - "null"
          description: 'Reduction mode: "off", "light", "moderate", "aggressive", "maximum"'
        preserve_important_words:
          type:
            - boolean
            - "null"
          description: Preserve capitalized/technical terms
    Translation:
      type: object
      description: |-
        Translation of the extracted content.

        Holds the translated rendition of `ExtractedDocument::content` and (when
        `preserve_markup` was requested) the translated `formatted_content`. Chunks
        are translated in place inside `ExtractedDocument::chunks[*].content` rather
        than duplicated here.
      required:
        - target_lang
        - content
      properties:
        content:
          type: string
          description: Translated plain-text body. Matches the shape of `ExtractedDocument::content`.
        formatted_content:
          type:
            - string
            - "null"
          description: |-
            Translated markup body (Markdown / HTML / etc.) when `preserve_markup` was
            enabled on the config. `None` otherwise.
        source_lang:
          type:
            - string
            - "null"
          description: BCP-47 source language. `None` when the translation backend was asked to detect.
        target_lang:
          type: string
          description: BCP-47 language tag the translation was produced into (e.g. `"de"`, `"fr-CA"`).
    TunableKnobInfo:
      type: object
      description: One knob that auto-tune can search over, for capability discovery.
      required:
        - knob
        - description
      properties:
        description:
          type: string
          description: Human-readable description of what this knob controls.
        knob:
          type: string
          description: Wire name of the knob, matching `autotune_core::search::Knob`'s serialized name.
    TuningProfileDetail:
      type: object
      description: Full detail of a promoted tuning profile.
      required:
        - id
        - name
        - profile
        - scores
        - created_at
      properties:
        created_at:
          type: string
          description: ISO 8601 creation timestamp.
        id:
          type: string
          description: Unique tuning profile ID.
        name:
          type: string
          description: Tuning profile name.
        profile:
          description: |-
            The tuning profile artifact. The concrete `TuningProfile` shape is
            defined in `autotune-core`; here it is opaque JSON.
        scores:
          description: |-
            Scores recorded for this profile at promotion time. The concrete
            shape is defined in `autotune-core`; here it is opaque JSON.
    TuningProfileSummary:
      type: object
      description: Lightweight projection of a tuning profile (for listings).
      required:
        - id
        - name
        - created_at
      properties:
        created_at:
          type: string
          description: ISO 8601 creation timestamp.
        id:
          type: string
          description: Unique tuning profile ID.
        name:
          type: string
          description: Tuning profile name.
    UriKind:
      type: string
      description: Semantic classification of an extracted URI.
      enum:
        - hyperlink
        - image
        - anchor
        - citation
        - reference
        - email
    UrlInput:
      type: object
      description: |-
        A seed URL for crawl-based extraction. Enterprise-only; Pro leaves
        [`ExtractRequest::urls`] empty.
      required:
        - url
      properties:
        crawl_config:
          description: |-
            Per-URL crawl configuration override, merged with the request-level
            `crawl_config`. Kept as opaque JSON here: the concrete crawl
            configuration schema is service-local
            (`services/api::rest::types::CrawlConfig`) and is out of scope for
            this convergence pass.
        url:
          type: string
          description: URL to crawl and extract documents from.
    UsageByMimeType:
      type: object
      description: Usage statistics broken down by MIME type.
      required:
        - documents
        - pages
        - failed
      properties:
        documents:
          type: integer
          format: int32
          description: Number of documents of this MIME type processed
        failed:
          type: integer
          format: int32
          description: Number of failed extractions for this MIME type
        pages:
          type: integer
          format: int64
          description: Total pages extracted from documents of this MIME type
    UsageResponse:
      type: object
      description: Current period usage and quota information.
      required:
        - period_start
        - period_end
        - total_pages
        - total_documents
        - total_failed
        - by_mime_type
      properties:
        by_mime_type:
          type: object
          description: Usage breakdown by MIME type
          additionalProperties:
            $ref: '#/components/schemas/UsageByMimeType'
          propertyNames:
            type: string
        period_end:
          type: string
          description: End of the reporting period (ISO 8601 date)
        period_start:
          type: string
          description: Start of the reporting period (ISO 8601 date)
        quota_limit:
          type:
            - integer
            - "null"
          format: int64
          description: Monthly page quota limit (null = unlimited)
        quota_remaining:
          type:
            - integer
            - "null"
          format: int64
          description: Remaining pages in monthly quota (null = unlimited)
        total_documents:
          type: integer
          format: int32
          description: Total documents processed in the period
        total_failed:
          type: integer
          format: int32
          description: Total failed extractions in the period
        total_pages:
          type: integer
          format: int64
          description: Total pages extracted in the period
    VlmFallbackPolicy:
      oneOf:
        - type: object
          description: No VLM fallback (default). Uses single-backend mode only.
          required:
            - mode
          properties:
            mode:
              type: string
              enum:
                - disabled
        - type: object
          description: |-
            Try the classical OCR backend first, then fall back to VLM below a quality
            threshold. Not available on the managed API — rejected with a 400.
          required:
            - quality_threshold
            - mode
          properties:
            mode:
              type: string
              enum:
                - on_low_quality
            quality_threshold:
              type: number
              format: double
        - type: object
          description: |-
            Send every page directly to VLM. Not available on the managed API —
            rejected with a 400.
          required:
            - mode
          properties:
            mode:
              type: string
              enum:
                - always
      description: |-
        VLM fallback policy for OCR operations.

        Determines whether and when to fall back from classical OCR (tesseract) to
        Vision Language Model (VLM) processing. VLM is not available on the managed
        API — any non-`disabled` policy is rejected with a 400.
    WebhookConfig:
      type: object
      description: Webhook configuration for async delivery of job results.
      required:
        - url
      properties:
        metadata:
          type:
            - object
            - "null"
          description: Optional key-value metadata included in the webhook payload.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        secret:
          type:
            - string
            - "null"
          description: Optional HMAC-SHA256 secret for signing the webhook payload.
        url:
          type: string
          description: URL to deliver results to.
    WebhookEvent:
      type: object
      description: |-
        Webhook event payload delivered to customer endpoints on job completion/failure.

        This is the exact JSON payload sent via HTTP POST to the webhook URL.
        The payload is signed with HMAC-SHA256 (see `X-Webhook-Signature` header)
        if a secret was configured.

        The `results` field is present for successful extraction jobs and contains
        the extracted document data. For failed jobs, `error` is populated instead.
      required:
        - event
        - job_id
        - timestamp
      properties:
        error:
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/WebhookEventError'
              description: Optional error details (present only if job failed or had partial failure).
        event:
          type: string
          description: 'Event type: "job.completed" or "job.failed".'
        job_id:
          type: string
          description: The job ID that triggered this webhook.
        metadata:
          type:
            - object
            - "null"
          description: |-
            Optional key-value metadata from the webhook configuration,
            echoed back for request correlation.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        results:
          description: |-
            Optional extraction results (present only if job succeeded).
            The shape depends on the extraction config (e.g., structured output,
            table detection, OCR results). Consumers should inspect the `event` type
            to determine expected fields.
        timestamp:
          type: string
          description: RFC3339-formatted timestamp when the job completed.
    WebhookEventError:
      type: object
      description: Error information included in webhook completion events.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code string carried from the job's `ErrorInfo` (e.g. "2001").
        message:
          type: string
          description: Human-readable error message.
    XmlMetadata:
      type: object
      description: |-
        XML metadata extracted during XML parsing.

        Provides statistics about XML document structure.
      required:
        - element_count
        - unique_elements
      properties:
        element_count:
          type: integer
          format: int32
          description: Total number of XML elements processed
          minimum: 0
        unique_elements:
          type: array
          items:
            type: string
          description: List of unique element tag names (sorted)
    YakeParams:
      type: object
      description: YAKE-specific parameters.
      required:
        - window_size
      properties:
        window_size:
          type: integer
          description: |-
            Window size for co-occurrence analysis (default: 2).

            Controls the context window for computing co-occurrence statistics.
          minimum: 0
    YearRange:
      type: object
      description: Year range for bibliographic metadata.
      properties:
        max:
          type:
            - integer
            - "null"
          format: int32
          description: Latest (maximum) year in the range.
          minimum: 0
        min:
          type:
            - integer
            - "null"
          format: int32
          description: Earliest (minimum) year in the range.
          minimum: 0
        years:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
          description: All individual years present in the collection.
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
